[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptforge"
version = "0.1.0"
description = "Turn any bash/python script into a usable app - by AIHAM AM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AIHAM AM" }]
keywords = ["kali", "pentest", "tui", "bash", "wrapper", "ctf"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "pexpect>=4.9",
  "bashlex>=0.18",
  "textual>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scriptforge = "scriptforge.cli:main"

[tool.setuptools.packages.find]
include = ["scriptforge*"]

