<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScriptForge</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --edge:#30363d;
    --text:#c9d1d9; --dim:#6e7681; --accent:#00d7af; --accent2:#5cffe0;
    --warn:#ffb800; --crit:#f85149; --ok:#3fb950; --blue:#58a6ff; --pink:#ff4d6d;
    --mono:"Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--mono);
    font-size:13px; display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--edge); flex:0 0 auto;
  }
  header img{width:30px;height:30px;border-radius:7px}
  header .title{font-size:15px;font-weight:700;color:var(--accent2);letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:11px}
  header .spacer{flex:1}
  .tabs{display:flex;gap:4px}
  .tab{
    padding:5px 13px;border-radius:7px;cursor:pointer;color:var(--dim);
    border:1px solid transparent; user-select:none; font-size:12px;
  }
  .tab:hover{color:var(--text);background:var(--panel2)}
  .tab.on{color:var(--bg);background:var(--accent);font-weight:700}
  main{flex:1;display:flex;min-height:0}
  aside{
    width:290px;flex:0 0 290px;border-right:1px solid var(--edge);
    display:flex;flex-direction:column;background:var(--panel);
  }
  .search{padding:10px;border-bottom:1px solid var(--edge)}
  .search input{
    width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--edge);
    border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;
  }
  .search input:focus{border-color:var(--accent)}
  #list{flex:1;overflow-y:auto}
  .item{padding:8px 12px;border-bottom:1px solid #1f242c;cursor:pointer;display:flex;
        flex-direction:column;gap:3px}
  .item:hover{background:var(--panel2)}
  .item.on{background:#16302c;box-shadow:inset 3px 0 0 var(--accent)}
  .item .n{font-weight:700;font-size:12px;word-break:break-all}
  .item .m{color:var(--dim);font-size:10.5px}
  .badge{padding:1px 7px;border-radius:20px;font-size:9.5px;font-weight:700;
         text-transform:uppercase;letter-spacing:.4px}
  .k-interactive{background:#0d3b34;color:var(--accent)}
  .k-parametric{background:#12263f;color:var(--blue)}
  .k-skeletal{background:#3a2f0b;color:var(--warn)}
  .k-fullscreen{background:#3d1622;color:var(--pink)}
  .k-opaque,.k-unknown{background:#24292f;color:var(--dim)}
  section{flex:1;display:flex;flex-direction:column;min-width:0}
  #head{padding:12px 16px;border-bottom:1px solid var(--edge);flex:0 0 auto}
  #head h2{margin:0 0 6px;font-size:15px;color:var(--accent2);word-break:break-all}
  #head .meta{color:var(--dim);font-size:11px;line-height:1.7}
  #head .meta b{color:var(--text)}
  #body{flex:1;overflow-y:auto;padding:16px}
  .empty{color:var(--dim);text-align:center;margin-top:70px;font-size:13px}
  .empty .big{font-size:40px;display:block;margin-bottom:14px;opacity:.5}
  .lbl{color:var(--warn);font-weight:700;margin:16px 0 7px;font-size:11px;
       text-transform:uppercase;letter-spacing:.8px}
  .lbl:first-child{margin-top:0}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
  .field label{font-size:11.5px;color:var(--text)}
  .field .hint{font-size:10px;color:var(--dim)}
  .field input,.field select{
    padding:8px 10px;background:var(--bg);border:1px solid var(--edge);
    border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field input.secret{letter-spacing:2px}
  .toolbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  button{
    padding:8px 15px;border-radius:8px;border:1px solid var(--edge);
    background:var(--panel2);color:var(--text);font-family:var(--mono);
    font-size:12px;cursor:pointer;font-weight:700;
  }
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent2)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.go{background:var(--accent);color:#04231d;border-color:var(--accent)}
  button.go:hover:not(:disabled){background:var(--accent2);color:#04231d}
  button.stop{background:var(--crit);color:#fff;border-color:var(--crit)}
  .console{
    margin-top:14px;border:1px solid var(--edge);border-radius:10px;overflow:hidden;
    display:none;
  }
  .console.show{display:block}
  .console .bar{
    padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--edge);
    display:flex;align-items:center;gap:10px;font-size:11px;
  }
  .console .bar .st{color:var(--dim)}
  .console pre{
    margin:0;padding:12px;background:var(--bg);color:var(--text);
    font-family:var(--mono);font-size:11.5px;line-height:1.55;
    max-height:340px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
  }
  .ok{color:var(--ok)} .bad{color:var(--crit)} .warn{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
  th,td{padding:6px 9px;border:1px solid var(--edge);text-align:left}
  th{background:var(--panel2);color:var(--warn);font-weight:700}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;color:var(--accent2)}
  .note{background:var(--panel2);border-left:3px solid var(--warn);
        padding:9px 12px;border-radius:0 8px 8px 0;font-size:11.5px;margin-top:12px}
  .toast{
    position:fixed;right:16px;bottom:16px;background:var(--panel2);
    border:1px solid var(--accent);border-radius:9px;padding:10px 15px;
    font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>div{flex:1;min-width:150px}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--edge);border-radius:6px}
  ::-webkit-scrollbar-track{background:var(--panel)}
</style>
</head>

  <div>
    <div class="title">SCRIPTFORGE</div>
    <div class="sub">any script &rarr; a real app &nbsp;·&nbsp; v__VERSION__ &nbsp;·&nbsp; __AUTHOR__</div>
  </div>
  <div class="spacer"></div>
  <div class="tabs">
    <div class="tab on" data-view="scripts">Scripts</div>
    <div class="tab" data-view="history">History</div>
  </div>
</header>

<main>
  <aside>
    <div class="search"><input id="q" placeholder="filter scripts…" autocomplete="off"></div>
    <div id="list"></div>
  </aside>
  <section>
    <div id="head"><h2 id="hname">—</h2><div class="meta" id="hmeta"></div></div>
    <div id="body"><div class="empty"><span class="big">▚</span>Pick a script on the left.</div></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let scripts = [], current = null, detail = null, es = null;

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.borderColor = bad ? "var(--crit)" : "var(--accent)";
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 3200);
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok && r.status !== 200) throw new Error("HTTP " + r.status);
  return r.json();
}

async function loadScripts() {
  const d = await api("/api/scripts");
  scripts = d.scripts;
  renderList();
  if (scripts.length) select(scripts[0].path);
  else $("#body").innerHTML =
    '<div class="empty"><span class="big">▚</span>No scripts found.<br><br>' +
    'Point scriptforge at a folder:<br><code>scriptforge gui ~/bin ~/scripts</code></div>';
}

function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const rows = scripts.filter(s => !q || s.name.toLowerCase().includes(q)
    || s.kind.includes(q) || (s.description||"").toLowerCase().includes(q));
  $("#list").innerHTML = rows.map(s => `
    <div class="item ${current === s.path ? "on" : ""}" data-p="${esc(s.path)}">
      <div class="n">${esc(s.name)} <span class="badge k-${s.kind}">${s.kind}</span></div>
      <div class="m">${s.lang} · ${s.lines}L · ${s.prompts}p ${s.args}a ${s.modes}m</div>
    </div>`).join("");
  document.querySelectorAll(".item").forEach(el =>
    el.onclick = () => select(el.dataset.p));
}

async function select(path) {
  current = path;
  renderList();
  detail = await api("/api/script?path=" + encodeURIComponent(path));
  $("#hname").textContent = detail.name;
  $("#hmeta").innerHTML =
    `<span class="badge k-${detail.kind}">${detail.kind}</span> &nbsp; ` +
    `<b>${detail.lang}</b> · ${detail.line_count} lines · parsed via ${detail.parse_mode}` +
    (detail.detected_tools && detail.detected_tools.length
      ? `<br>tools: ${detail.detected_tools.map(t=>`<code>${esc(t)}</code>`).join(" ")}` : "");
  renderForm();
}

function renderForm() {
  const d = detail, b = $("#body");
  let h = "";

  if (d.warnings && d.warnings.length)
    d.warnings.forEach(w => h += `<div class="note">⚠ ${esc(w)}</div>`);

  if (d.description) h += `<div class="meta">${esc(d.description)}</div>`;
  if (d.usage_text)
    h += `<div class="lbl">Usage</div><div class="note" style="border-color:var(--blue)">
         <pre style="all:unset;font-family:var(--mono)">${esc(d.usage_text)}</pre></div>`;

  if (d.subcommands && d.subcommands.length) {
    h += `<div class="lbl">Mode</div><div class="field">
      <select id="f-sub">${d.subcommands.map(s =>
        `<option value="${esc(s.name)}">${esc(s.name)} — ${esc(s.help||"")}</option>`).join("")}</select></div>`;
  }

  if (d.prompt_sites && d.prompt_sites.length) {
    h += `<div class="lbl">Questions (${d.prompt_sites.length})</div>`;
    d.prompt_sites.forEach(p => {
      const id = `p${p.line}_${p.var}`;
      if (p.widget === "choice" && p.choices.length) {
        h += `<div class="field"><label>${esc(p.prompt)}</label>
          <select id="${id}" data-var="${esc(p.var)}">
          <option value="">—</option>
          ${p.choices.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>`;
      } else {
        h += `<div class="field"><label>${esc(p.prompt)}
          ${p.widget==="secret"?'<span class="hint">secret</span>':""}</label>
          <input id="${id}" data-var="${esc(p.var)}" class="${p.widget==="secret"?"secret":""}"
            placeholder="${esc(p.var)}" autocomplete="off"></div>`;
      }
    });
  }

  if (d.positional_args && d.positional_args.length) {
    h += `<div class="lbl">Arguments</div>`;
    d.positional_args.forEach(a => {
      h += `<div class="field"><label>${esc(a.name)}
        ${a.help?`<span class="hint">${esc(a.help)}</span>`:""}</label>
        <input id="a_${esc(a.name)}" data-arg="${esc(a.name)}" placeholder="${esc(a.name)}"></div>`;
    });
  }

  if (d.kind === "skeletal") {
    h += `<div class="note"><b>No interface found.</b>
      ScriptForge will generate an interactive wrapper in
      <code>~/.scriptforge/built/</code>. Your original file is never modified.</div>`;
  }
  if (d.kind === "opaque") {
    h += `<div class="note"><b>Package shim.</b> It delegates to an installed package,
      so there is nothing to re-program. Arguments are passed through as typed.</div>`;
  }

  h += `<div class="toolbar">
    ${d.kind === "skeletal"
      ? '<button class="go" id="b-forge">⚒ Re-program script</button>'
      : '<button class="go" id="b-run">▶ Run</button>'}
    <button id="b-clear">Clear</button>
  </div>`;

  h += `<div class="console" id="console">
    <div class="bar"><b>Output</b><span class="st" id="cstat">starting…</span>
      <span style="flex:1"></span>
      <button class="stop" id="b-stop" style="padding:3px 9px;font-size:10px">Stop</button>
    </div><pre id="cpane"></pre></div>`;

  b.innerHTML = h;

  const forge = $("#b-forge");
  if (forge) forge.onclick = doForge;
  $("#b-run").onclick = () => doRun(false);
  $("#b-clear").onclick = () => { $("#cpane").textContent = ""; };
  $("#b-stop").onclick = () => { if (es) es.close(); };
}

function collect() {
  const answers = {}, extra = [];
  let sub = null;
  document.querySelectorAll("[data-var]").forEach(el => {
    if (el.value.trim()) answers[el.dataset.var] = el.value.trim();
  });
  document.querySelectorAll("[data-arg]").forEach(el => {
    if (el.value.trim()) extra.push(el.value.trim());
  });
  const s = $("#f-sub"); if (s) sub = s.value || null;
  return {answers, args: extra, subcommand: sub};
}

async function doForge() {
  const btn = $("#b-forge"); btn.disabled = true; btn.textContent = "working…";
  const d = await api("/api/forge", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({path: current})
  }).catch(e => ({ok:false, error:String(e)}));
  btn.disabled = false; btn.textContent = "⚒ Re-program script";
  if (!d.ok) { toast(d.error || "failed", true); return; }
  toast("wrapper written: " + d.path.split("/").pop());
  await loadScripts();
  select(d.path);
}

function doRun(force) {
  if (es) { es.close(); return; }
  const {answers, args, subcommand} = collect();
  if (subcommand) args.unshift(subcommand);
  $("#console").classList.add("show");
  const pane = $("#cpane"), stat = $("#cstat");
  pane.textContent = "";
  stat.className = "st"; stat.textContent = "running…";

  es = new EventSource("/api/run", {withCredentials:false});
  // EventSource is GET-only, so POST via fetch + ReadableStream instead.
  es.close(); es = null;

  fetch("/api/run", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({path: current, answers, args, timeout: 600})
  }).then(async resp => {
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = "message", data = "";
        frame.split("\n").forEach(line => {
          if (line.startsWith("event: ")) ev = line.slice(7).trim();
          else if (line.startsWith("data: ")) data += line.slice(6);
        });
        handleEvent(ev, data, pane, stat);
      }
    }
  }).catch(e => { stat.className = "st bad"; stat.textContent = String(e); });
}

function handleEvent(ev, data, pane, stat) {
  let d; try { d = JSON.parse(data); } catch { return; }
  if (ev === "start") { stat.textContent = "running…"; }
  else if (ev === "chunk") { pane.textContent += d; pane.scrollTop = pane.scrollHeight; }
  else if (ev === "error") { stat.className = "st bad"; stat.textContent = d; }
  else if (ev === "done") {
    stat.className = "st " + (d.exit === 0 ? "ok" : "bad");
    stat.textContent = `exit ${d.exit} in ${d.seconds}s` + (d.timed_out ? " (timed out)" : "");
    if (d.exit !== 0 && !pane.textContent) pane.textContent = d.output || "";
    loadHistoryBadge();
  }
}

async function loadHistory() {
  const d = await api("/api/history");
  $("#hname").textContent = "Run history";
  $("#hmeta").innerHTML = `<b>${d.runs.length}</b> runs recorded locally`;
  const rows = d.runs.map(r => `<tr>
    <td class="${r.exit===0?"ok":"bad"}">${r.exit===0?"✓":"✗"} ${r.exit}</td>
    <td>${esc(r.script)}</td><td><span class="badge k-${r.kind}">${r.kind}</span></td>
    <td>${r.seconds}s</td><td>${new Date(r.when*1000).toLocaleString()}</td></tr>`).join("");
  $("#body").innerHTML = d.runs.length
    ? `<table><thead><tr><th>Exit</th><th>Script</th><th>Kind</th><th>Time</th><th>When</th></tr></thead>
       <tbody>${rows}</tbody></table>`
    : '<div class="empty"><span class="big">◷</span>No runs yet.</div>';
}

function loadHistoryBadge() {}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  if (t.dataset.view === "history") loadHistory(); else loadScripts();
});
$("#q").oninput = renderList;
loadScripts();
</script>
</body>
