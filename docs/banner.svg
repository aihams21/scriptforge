<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="ScriptForge by AIHAM AM">
  <title>ScriptForge — any script becomes a usable app</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1015"/>
      <stop offset="55%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#1b1409"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a028"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a028" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#f0a028" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f0a028" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- anvil: the forge mark, drawn as one path so it stays crisp at any size -->
  <g transform="translate(96 118)">
    <path d="M8 44 h128 c0 26 -18 42 -42 48 l0 22 c22 4 38 12 46 24 h-136 c8 -12 24 -20 46 -24 l0 -22 c-24 -6 -42 -22 -42 -48 z"
          fill="url(#ember)"/>
    <path d="M22 62 h100 a30 30 0 0 1 -30 26 h-40 a30 30 0 0 1 -30 -26 z" fill="#0e1015" opacity="0.55"/>
    <circle cx="72" cy="74" r="9" fill="#0e1015" opacity="0.8"/>
    <path d="M46 26 l12 -18 h28 l12 18 z" fill="#ffb347" opacity="0.9"/>
  </g>

  <text x="288" y="176" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="74" font-weight="700" letter-spacing="-2" fill="#e9ecf2">
    Script<tspan fill="#f0a028">Forge</tspan>
  </text>

  <text x="290" y="216" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="22" fill="#9aa3b5" letter-spacing="0.4">
    Turn any bash, python or PowerShell script into a real desktop app.
  </text>

  <rect x="290" y="244" width="640" height="2" fill="url(#rule)"/>

  <g font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif" font-size="15">
    <rect x="290" y="272" width="150" height="30" rx="6" fill="#f0a028"/>
    <text x="365" y="292" fill="#14161c" font-weight="700" text-anchor="middle">Linux</text>
    <rect x="450" y="272" width="168" height="30" rx="6" fill="#f0a028"/>
    <text x="534" y="292" fill="#14161c" font-weight="700" text-anchor="middle">Windows 11</text>
    <rect x="628" y="272" width="150" height="30" rx="6" fill="none" stroke="#2f3542"/>
    <text x="703" y="292" fill="#9aa3b5" text-anchor="middle">MIT licence</text>
    <rect x="788" y="272" width="132" height="30" rx="6" fill="none" stroke="#2f3542"/>
    <text x="854" y="292" fill="#9aa3b5" text-anchor="middle">v0.1.0</text>
  </g>

  <text x="290" y="342" font-family="'DejaVu Sans',Segoe UI,Helvetica,Arial,sans-serif"
        font-size="17" fill="#6f7789" letter-spacing="3">
    by AIHAM AM
  </text>

  <!-- terminal motif, right edge -->
  <g transform="translate(1000 96)" opacity="0.5" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="13">
    <rect x="0" y="0" width="216" height="150" rx="10" fill="#0b0d12" stroke="#252a35"/>
    <circle cx="16" cy="15" r="4" fill="#f85149"/>
    <circle cx="30" cy="15" r="4" fill="#d29922"/>
    <circle cx="44" cy="15" r="4" fill="#3fb950"/>
    <text x="16" y="46" fill="#5d6577">$</text>
    <text x="30" y="46" fill="#e6e9ef">scan.sh</text>
    <text x="16" y="70" fill="#3fb950">✓ interface generated</text>
    <text x="16" y="94" fill="#8b93a5">  11 fields · 2 modes</text>
    <text x="16" y="118" fill="#f0a028">▸ run</text>
    <text x="16" y="140" fill="#5d6577">$</text>
  </g>
</svg>