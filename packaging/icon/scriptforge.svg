<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ScriptForge</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d7af"/>
      <stop offset="100%" stop-color="#0a8f77"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cffe0"/>
      <stop offset="100%" stop-color="#00c9a2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none"
        stroke="url(#edge)" stroke-width="7" opacity="0.85"/>
  <rect x="38" y="38" width="436" height="436" rx="86" fill="none"
        stroke="#00d7af" stroke-width="2" opacity="0.16"/>

  <!-- forge spark -->
  <g filter="url(#glow)" opacity="0.95">
    <path d="M256 78 L272 122 L316 138 L272 154 L256 198 L240 154 L196 138 L240 122 Z"
          fill="#ffb800"/>
  </g>

  <!-- terminal window -->
  <g>
    <rect x="92" y="222" width="328" height="212" rx="26"
          fill="#010409" stroke="#00d7af" stroke-width="5"/>
    <!-- title dots -->
    <circle cx="132" cy="260" r="8" fill="#ff4d6d"/>
    <circle cx="162" cy="260" r="8" fill="#ffb800"/>
    <circle cx="192" cy="260" r="8" fill="#3fb950"/>
    <line x1="112" y1="286" x2="400" y2="286" stroke="#00d7af" stroke-width="3" opacity="0.35"/>

    <!-- prompt chevron + caret -->
    <path d="M138 322 L182 354 L138 386" fill="none" stroke="url(#glyph)"
          stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="204" y="366" width="86" height="18" rx="9" fill="#5cffe0" opacity="0.95"/>

    <!-- output bars -->
    <rect x="138" y="404" width="150" height="13" rx="6.5" fill="#00d7af" opacity="0.5"/>
    <rect x="300" y="404" width="88" height="13" rx="6.5" fill="#ff4d6d" opacity="0.65"/>
  </g>
</svg>